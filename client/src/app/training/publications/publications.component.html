<div class="card-header">
  <div class="row">
    <div class="col-sm-6">
      <h4 *ngIf="!showDetailsPanel()"><span class="badge badge-secondary">List of publications</span></h4>
      <h4 *ngIf="showDetailsPanel()"><span class="badge badge-secondary">Publication details</span></h4>
    </div>
    <div class="col-sm-6">
      <button *ngIf="!showDetailsPanel()" class="btn btn-secondary btn-sm" style="float: right;"
        (click)="addPublication()">Add Publication</button>
    </div>
  </div>
</div>
<div class="card-body">

  <table class="table table-striped table-hover table-bordered" *ngIf="!showDetailsPanel()">
    <thead>
      <tr>
        <th>Id</th>
        <th>Authors</th>
        <th>Title</th>
        <th>DOI</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of listOfPublications">
        <td>{{item.publicationId}}</td>
        <td>{{item.author}}</td>
        <td>{{item.title}}</td>
        <td>{{item.doi}}</td>
        <td>
          <button class="btn btn-info btn-sm" (click)="showPublicationDetails(item.publicationId)">details</button>
          <button class="btn btn-warning btn-sm" (click)="deleteCurrentPublication(item.publicationId)">delete</button>
        </td>
      </tr>
    </tbody>
  </table>
  <form [formGroup]="detailsForm" id="detailsForm" (ngSubmit)="updatePublication()" *ngIf="showDetailsPanel()">

    <div class="row">
      <div class="col-sm-6">
        <div class="row">
          <div class="col-sm-6">
            <h5><span class="badge badge-secondary">Id:</span></h5>
          </div>
          <div class="col-sm-6">
            <div [formGroup]="detailsForm">
              <input [formControl]='detailsForm.controls["PublicationId"]' class="form-control" readonly>
            </div>
          </div>
        </div>
        <div class="row mt-2">
          <div class="col-sm-6 mb-1">
            <h5><span class="badge badge-secondary">Author:</span></h5>
          </div>
          <div class="col-sm-6 mb-1">
            <div [formGroup]="detailsForm">
              <input [formControl]='detailsForm.controls["Author"]' class="form-control">
            </div>
          </div>
        </div>
        <div class="row mt-2">
          <div class="col-sm-6 mb-1">
            <h5><span class="badge badge-secondary">Title:</span></h5>
          </div>
          <div class="col-sm-6 mb-1">
            <div [formGroup]="detailsForm">
              <input [formControl]='detailsForm.controls["Title"]' class="form-control">
            </div>
          </div>
        </div>
        <div class="row mt-2">
          <div class="col-sm-6 mb-1">
            <h5><span class="badge badge-secondary">Volume:</span></h5>
          </div>
          <div class="col-sm-6 mb-1">
            <div [formGroup]="detailsForm">
              <input [formControl]='detailsForm.controls["Volume"]' class="form-control">
            </div>
          </div>
        </div>
        <div class="row mt-2">
          <div class="col-sm-6 mb-1">
            <h5><span class="badge badge-secondary">Issue:</span></h5>
          </div>
          <div class="col-sm-6 mb-1">
            <div [formGroup]="detailsForm">
              <input [formControl]='detailsForm.controls["Issue"]' class="form-control">
            </div>
          </div>
        </div>
        <div class="row mt-2">
          <div class="col-sm-6 mb-1">
            <h5><span class="badge badge-secondary">Place of publication:</span></h5>
          </div>
          <div class="col-sm-6 mb-1">
            <div [formGroup]="detailsForm">
              <input [formControl]='detailsForm.controls["PlaceOfPublication"]' class="form-control">
            </div>
          </div>
        </div>
        <div class="row mt-2">
          <div class="col-sm-6 mb-1">
            <h5><span class="badge badge-secondary">Publisher:</span></h5>
          </div>
          <div class="col-sm-6 mb-1">
            <div [formGroup]="detailsForm">
              <input [formControl]='detailsForm.controls["Publisher"]' class="form-control">
            </div>
          </div>
        </div>
        <div class="row mt-2">
          <div class="col-sm-6 mb-1">
            <h5><span class="badge badge-secondary">Editor:</span></h5>
          </div>
          <div class="col-sm-6 mb-1">
            <div [formGroup]="detailsForm">
              <input [formControl]='detailsForm.controls["Editor"]' class="form-control">
            </div>
          </div>
        </div>
        <div class="row mt-2">
          <div class="col-sm-6 mb-1">
            <h5><span class="badge badge-secondary">Date Published:</span></h5>
          </div>
          <div class="col-sm-6 mb-1">
            <div [formGroup]="detailsForm">
              <input type="text" class="form-control" #dp="bsDatepicker" bsDatepicker
                [formControl]='detailsForm.controls["dateOfPublication"]' [bsConfig]="{ dateInputFormat: 'YYYY/MM/DD' }"
                name="datum1" />
            </div>
          </div>
        </div>
        <div class="row mt-2">
          <div class="col-sm-6 mb-1">
            <h5><span class="badge badge-secondary">URL:</span></h5>
          </div>
          <div class="col-sm-6 mb-1">
            <div [formGroup]="detailsForm">
              <input [formControl]='detailsForm.controls["URL"]' class="form-control">
            </div>
          </div>
        </div>
        <div class="row mt-2">
          <div class="col-sm-6 mb-1">
            <h5><span class="badge badge-secondary">DOI:</span></h5>
          </div>
          <div class="col-sm-6 mb-1">
            <div [formGroup]="detailsForm">
              <input [formControl]='detailsForm.controls["DOI"]' class="form-control">
            </div>
          </div>
        </div>
      </div>
      <div class="col-sm-6">
        <div class="card">
          <img src="../../../assets/images/else-11.jpeg" alt="test" width="375" height="500" />
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-sm-6">

        <button type="button" class="btn btn-warning btn-sm" (click)="Cancel()">Cancel</button>
        <button type="submit" class="btn btn-success btn-sm">Submit</button>
      </div>
      <div class="col-sm-6"></div>

    </div>
  </form>
</div>
