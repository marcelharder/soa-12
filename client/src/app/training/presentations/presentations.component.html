<div class="card-header">
  <div class="row">
    <div class="col-sm-6">
      <h4 *ngIf="!showDetailsPanel()"><span class="badge badge-secondary">List of presentations</span></h4>
      <h4 *ngIf="showDetailsPanel()"><span class="badge badge-secondary">details</span></h4>
    </div>
    <div class="col-sm-6">
      <button *ngIf="!showDetailsPanel()" class="btn btn-secondary btn-sm" style="float: right;"
        (click)="addPresentation()">Add Presentation</button>
    </div>
  </div>
</div>
<div class="card-body">

  <table class="table table-striped table-hover table-bordered" *ngIf="!showDetailsPanel()">
    <thead>
      <tr>
        <th>Title</th>
        <th>Venue</th>
        <th>Media</th>
        <th>Date presented</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of listOfPresentations">
        <td>{{item.title}}</td>
        <td>{{item.venue}}</td>
        <td>{{item.media}}</td>
        <td>{{item.datePresented}}</td>
        <td>
          <button class="btn btn-info btn-sm" (click)="showDetails(item.presentationId)">details</button>
          <button class="btn btn-warning btn-sm" (click)="deleteModel(item.presentationId)">delete</button>
        </td>
      </tr>


    </tbody>
  </table>
  <form [formGroup]="detailsForm" id="detailsForm" (ngSubmit)="updatePresentation()" *ngIf="showDetailsPanel()">

    <div class="row">
      <div class="col-sm-6">

        <div class="row">
          <div class="col-sm-6">
            <h5><span class="badge badge-secondary">Id:</span></h5>
          </div>
          <div class="col-sm-6">
            <div [formGroup]="detailsForm">
              <input [formControl]='detailsForm.controls["PresentationId"]' class="form-control" readonly>
            </div>
          </div>
        </div>

        <div class="row mt-2">
          <div class="col-sm-6 mb-1">
            <h5><span class="badge badge-secondary">Title:</span></h5>
          </div>
          <div class="col-sm-6 mb-1">
            <div [formGroup]="detailsForm">
              <input [formControl]='detailsForm.controls["Title"]' class="form-control">
            </div>
          </div>
        </div>
        <div class="row mt-2">
          <div class="col-sm-6 mb-1">
            <h5><span class="badge badge-secondary">Venue:</span></h5>
          </div>
          <div class="col-sm-6 mb-1">
            <div [formGroup]="detailsForm">
              <input [formControl]='detailsForm.controls["Venue"]' class="form-control">
            </div>
          </div>
        </div>
        <div class="row mt-2">
          <div class="col-sm-6 mb-1">
            <h5><span class="badge badge-secondary">Media:</span></h5>
          </div>
          <div class="col-sm-6 mb-1">
            <div [formGroup]="detailsForm">
              <input [formControl]='detailsForm.controls["Media"]' class="form-control">



            </div>
          </div>
        </div>

        <div class="row mt-2">
          <div class="col-sm-6 mb-1">
            <h5><span class="badge badge-secondary">Date Presented:</span></h5>
          </div>
          <div class="col-sm-6 mb-1">
            <div [formGroup]="detailsForm">
              <input type="text" class="form-control" #dp="bsDatepicker" bsDatepicker
                [formControl]='detailsForm.controls["DatePresented"]' [bsConfig]="{ dateInputFormat: 'YYYY/MM/DD' }"
                name="datum1" />
            </div>
          </div>
        </div>
      </div>
      <div class="col-sm-6">
        <div class="card">
          <img src="../../../assets/images/else-12.jpeg" alt="test" width="375" height="500" />
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-sm-6">
        <div class="btn-group btn-group-sm">
          <button type="button" class="btn btn-warning" (click)="Cancel()">Cancel</button>
          <button type="submit" class="btn btn-success">Submit</button>
        </div>
      </div>
      <div class="col-sm-6"></div>

    </div>
  </form>
</div>
