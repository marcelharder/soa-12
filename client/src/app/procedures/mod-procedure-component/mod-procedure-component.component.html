<div class="card mt-5">
    <div class="card-header">
      <div class="row">
        <div class="col-sm-6">
          <h3>
            <span class="badge badge-secondary mr-2"> {{selectedHospital}} </span>
          </h3>
        </div>
        <div class="col-sm-6">
         
       </div>
      </div>
     
      <div class="row">
        <div class="col-sm-6">
          <div class="row">
            <div class="col-sm-6">
            
            </div>
            <div class="col-sm-6"></div>
          </div>
        </div>
        <div class="col-sm-6">
        </div>
      </div>
     
    </div>
    <div class="card-body">
      <div class="row">
        <div class="col-sm-12">
          <table class="table table-striped">
            <tr>
              <th>ID</th>
              <th>description</th>
              <th>Surgeon</th>
              <th>Assistant</th>
              <th>Date</th>
              <th></th>
            </tr>
            <tr *ngFor="let pro of procedures">
              <td>{{pro.procedureId}}</td>
              <td>{{pro.description}}</td>
              <td>{{pro.Surgeon}}</td>
              <td>{{pro.Assistant}}</td>
              <td>{{pro.dateOfSurgery | date : 'shortDate'}}</td>
              <td><a  (click)="testNav(pro)" style='color:crimson'>Details</a></td> 
            </tr>
          </table>
        </div>
      </div>
      <div class="d-flex justify-content-center">
        <pagination [boundaryLinks]="true"
                    [totalItems]="pagination.totalItems"
                    [(ngModel)]="pagination.currentPage"
                    (pageChanged)="pageChanged($event)"
                    previousText="&lsaquo;" nextText="&rsaquo;" firstText="&laquo;" lastText="&raquo;">
        </pagination>

      </div>



    </div>
</div>
