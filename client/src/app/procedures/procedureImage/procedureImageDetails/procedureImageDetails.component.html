<div class="card">
  <div class="card-header">
    <div class="row">
      <div class="col-sm-8"><h6>{{ selectedProcedure.Description }}</h6></div>
      <div class="col-sm-4"></div>
  </div>
  <div class="card-body card-img-wrapper">

    <img
      [src]="getImageUrlFromArray(selectedProcedure.Id)"
      alt="image slide"
      style="display: block; width: 100%; height: 200px"
    />
    <ul class="list-inline member-icons animate text-center">
      <li class="list-inline-item">
          <button class="btn btn-primary" (click)="getImageFull(selectedProcedure.Id)"><i class="fa fa-user"></i></button>
      </li>
    </ul>

  </div>
  <div class="card-footer">
    <button class="btn btn-secondary btn-xxs" (click)="deleteImage()">Remove</button>
  </div>
</div>
